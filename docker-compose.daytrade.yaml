# Zweiter Bot: Daytrader. Laeuft neben dem bestehenden Bot, eigener Container und eigene Datenbank.
# Start: ./daytrade.sh start
name: ali-daytrade
services:
  daytrade:
    image: freqtradeorg/freqtrade:stable
    container_name: ali-daytrade
    restart: unless-stopped
    env_file: .env.daytrade
    volumes:
      - ./user_data:/freqtrade/user_data
    # Web-Dashboard nur lokal: per SSH-Tunnel oeffnen (ssh -L 18081:127.0.0.1:18081 <server>)
    ports:
      - "127.0.0.1:18081:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/daytrade.log
      --config /freqtrade/user_data/config-daytrade.json
      --strategy ${DT_STRATEGY:-DaytradeConfluence}
